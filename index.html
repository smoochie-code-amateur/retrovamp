<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroVamp — Каталог ігор</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <div class="page">
    <header>
      <a class="logo" href="index.html"><img src="assets/theme/logo.svg" alt="RetroVamp" /></a>
      <div class="ribbon"><div class="marquee"><span id="marquee">Ласкаво просимо у RetroVamp!</span></div></div>
      <label class="cursor-pick">Курсор:
        <select id="cursorPicker">
          <option value="system">Системний</option>
          <option value="gothic-black-red">Хрест</option>
          <option value="vampire">Вампір</option>
        </select>
      </label>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <img class="chrest" src="assets/theme/chrest.png" alt="" />
        <div class="side-head">Категорії</div>
        <div class="scroll-wrap">
          <div class="cats-scroll">
            <ul class="cats" id="cats"></ul>
          </div>
        </div>
      </aside>

      <main class="content">
        <input class="search" id="search" type="search" placeholder="Пошук гри…" />
        <div class="grid" id="grid"></div>
        <div class="pager" id="pager"></div>
      </main>
    </div>

  </div>

  <div class="vampire"><img src="assets/theme/vampire_woman_stand.png" alt="" /></div>
<footer>
    <div class="footer-inner">
      <img class="skull" src="assets/theme/skull_left.svg" alt="" />
      <nav class="footer-links" id="footer-links"></nav>
      <img class="skull" src="assets/theme/skull_right.svg" alt="" />
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
